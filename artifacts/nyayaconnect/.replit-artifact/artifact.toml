kind = "web"
previewPath = "/"
title = "NyayaConnect"
version = "1.0.0"
id = "artifacts/nyayaconnect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21319

[services.development]
run = "pnpm --filter @workspace/nyayaconnect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nyayaconnect", "run", "build" ]
serve = "static"
publicDir = "artifacts/nyayaconnect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21319"
BASE_PATH = "/"
